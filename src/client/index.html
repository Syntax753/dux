<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DUX — Deus Ex Duckina</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="app">
      <header>
        <h1>DUX &mdash; Deus Ex Duckina</h1>
        <span id="status" class="status"></span>
      </header>

      <div id="options-screen">
        <p>Configure your dungeon, adventurer:</p>
        <div class="option-row">
          <label for="room-count">Number of rooms</label>
          <input type="number" id="room-count" value="5" min="1" max="50" />
        </div>
        <button id="start-btn" class="start-btn">Enter the Dungeon</button>
      </div>

      <div id="loading" class="hidden">
        <canvas id="loading-canvas"></canvas>
        <div id="loading-text">Generating world...</div>
      </div>

      <div id="game" class="hidden">
        <div id="game-area">
          <canvas id="game-canvas"></canvas>
          <div id="narrative-panel"></div>
        </div>
        <div id="look-bar">You see nothing of interest.</div>
        <div id="inventory-panel">Inventory: empty</div>
      </div>

      <div id="radial-menu" style="display: none"></div>
    </div>

    <div id="controls-hint">
      <span>WASD/Arrows/Numpad: Move</span>
      <span>7,9,1,3: Diagonals</span>
      <span>5: Wait</span>
      <span>E: Interact</span>
      <span>ESC: Cancel</span>
    </div>

    <script type="module" src="main.ts"></script>
  </body>
</html>
